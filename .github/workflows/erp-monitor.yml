name: IIT KGP ERP Monitor

on:
  schedule:
    # GitHub Actions uses UTC. This runs approximately every 30 minutes.
    # Run approximately every 30 minutes, offset from :00/:30
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: erp-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one ERP monitoring cycle
        env:
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          SECURITY_Q1: ${{ secrets.SECURITY_Q1 }}
          SECURITY_A1: ${{ secrets.SECURITY_A1 }}
          SECURITY_Q2: ${{ secrets.SECURITY_Q2 }}
          SECURITY_A2: ${{ secrets.SECURITY_A2 }}
          SECURITY_Q3: ${{ secrets.SECURITY_Q3 }}
          SECURITY_A3: ${{ secrets.SECURITY_A3 }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run_monitor.py

      - name: Commit updated monitor state and dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard_data.json seen_notices.json seen_placements.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update ERP monitor state"
            git push
          fi
